name: Create release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Calculate next version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          latest_version="$({ git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)"
          if [[ -z "$latest_version" ]]; then
            latest_version="v1.0.7"
          fi

          IFS=. read -r major minor patch <<< "${latest_version#v}"
          case "$BUMP" in
            major)
              version="$((major + 1)).0.0"
              ;;
            minor)
              version="${major}.$((minor + 1)).0"
              ;;
            patch)
              version="${major}.${minor}.$((patch + 1))"
              ;;
            *)
              echo "Unsupported version bump: $BUMP" >&2
              exit 1
              ;;
          esac

          echo "VERSION=v$version" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Creating release v$version from $(git rev-parse --short HEAD)."

      - name: Validate version is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists." >&2
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists." >&2
            exit 1
          fi

      - name: Build bundled addon ZIP
        run: |
          set -euo pipefail
          rm -rf stage dist
          mkdir -p stage dist
          git archive --format=tar --prefix=AutoEverything/ HEAD | tar -xf - -C stage
          cp -R Packaging/AutoEverything_AuctionDB stage/AutoEverything_AuctionDB
          sed -i "1a ## Version: ${VERSION#v}" stage/AutoEverything/AutoEverything.toc
          (cd stage && zip -q -r ../dist/AutoEverything.zip AutoEverything AutoEverything_AuctionDB)

      - name: Validate bundled addon ZIP
        run: |
          set -euo pipefail
          archive=dist/AutoEverything.zip
          unzip -t "$archive"
          unzip -Z1 "$archive" | grep -qx 'AutoEverything/AutoEverything.toc'
          unzip -Z1 "$archive" | grep -qx 'AutoEverything_AuctionDB/AutoEverything_AuctionDB.toc'
          unzip -Z1 "$archive" | grep -qx 'AutoEverything_AuctionDB/Database.lua'

          roots="$(unzip -Z1 "$archive" | cut -d/ -f1 | sort -u | paste -sd' ' -)"
          if [[ "$roots" != 'AutoEverything AutoEverything_AuctionDB' ]]; then
            echo "Unexpected top-level archive folders: $roots" >&2
            exit 1
          fi

          if unzip -Z1 "$archive" | grep -E '(^|/)(\.git|\.github|\.pi|\.claude|Quest/tools|Packaging|dist)(/|$)|(^|/)(AGENTS\.md|\.gitignore|\.gitattributes)$'; then
            echo 'Developer-only files entered the release archive.' >&2
            exit 1
          fi

          while IFS= read -r file; do
            file="${file//$'\r'/}"
            file="${file//\\//}"
            [[ -z "$file" || "$file" == \#* ]] && continue
            unzip -Z1 "$archive" | grep -Fqx "AutoEverything/$file" || {
              echo "Main TOC file is missing from the archive: $file" >&2
              exit 1
            }
          done < AutoEverything.toc

      - name: Publish GitHub release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/AutoEverything.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "$VERSION" \
            --generate-notes
